name: Update User Agents
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update:
    name: Update user agents
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Create branch
        run: |
          git push origin --delete 'chore/update-user-agents' 2>/dev/null || true
          git checkout -B 'chore/update-user-agents'

      - name: Install user-agents
        run: npm install --no-save user-agents

      - name: Generate user agents
        run: node .github/updateUserAgents.js

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add play-dl/Request/useragents.json
          git commit --signoff --message 'chore(user-agents): update user agents'

      - name: Open pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --set-upstream origin chore/update-user-agents

          {
            echo 'Automated monthly refresh of the desktop user-agent pool in `play-dl/Request/useragents.json`, used to vary the User-Agent header on outbound HTTP requests.'
            echo ''
            echo '#### New user agents:'
            jq -r '.[] | "- " + .' play-dl/Request/useragents.json
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --title 'chore(user-agents): update user agents' \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --head 'chore/update-user-agents'
